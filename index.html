<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日色彩</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-primary: #FF6B9D;
      --theme-secondary: #C084FC;
      --bg-gradient-start: #fdf2f8;
      --bg-gradient-end: #fae8ff;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text-color: #1f2937;
      --subtext-color: #6b7280;
      --border-color: #e5e7eb;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans SC', system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      transition: all 0.5s ease;
    }

    .galaxy {
      --bg-gradient-start: #0f0c29;
      --bg-gradient-end: #302b63;
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-color: #ffffff;
      --subtext-color: #a5b4fc;
      --border-color: rgba(255, 255, 255, 0.1);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .garden {
      --bg-gradient-start: #f0fdf4;
      --bg-gradient-end: #fef3c7;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text-color: #1f2937;
      --subtext-color: #6b7280;
      --border-color: #e5e7eb;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .navbar h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--theme-primary) 0%, var(--theme-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .theme-switch {
      display: flex;
      gap: 0.5rem;
    }

    .theme-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 20px;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .theme-btn.active {
      background: linear-gradient(135deg, var(--theme-primary) 0%, var(--theme-secondary) 100%);
      color: white;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .color-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .today-label {
      font-size: 0.9rem;
      color: var(--subtext-color);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--theme-primary);
    }

    .color-display {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
      position: relative;
    }

    .color-display::before {
      content: '';
      position: absolute;
      top: 15%;
      left: 15%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }

    .color-name {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    .color-hex {
      font-size: 0.9rem;
      font-family: monospace;
      color: var(--subtext-color);
      background: rgba(0, 0, 0, 0.05);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      display: inline-block;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }

    .stat-item {
      text-align: center;
      padding: 1rem;
      background: var(--card-bg);
      border-radius: 16px;
      min-width: 90px;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--theme-primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--subtext-color);
      margin-top: 0.2rem;
    }

    .week-trail {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .week-title {
      font-size: 0.9rem;
      color: var(--subtext-color);
      margin-bottom: 1rem;
    }

    .week-dots {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .week-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .week-dot.filled {
      background: var(--theme-primary);
      border-color: var(--theme-primary);
    }

    .week-dot.today {
      border-width: 3px;
      border-color: var(--theme-primary);
    }

    .week-dot.filled.today {
      box-shadow: 0 0 0 4px rgba(var(--theme-primary), 0.2);
    }

    .week-dot:hover {
      transform: scale(1.1);
    }

    .week-dot::after {
      content: '';
      position: absolute;
      bottom: -18px;
      font-size: 0.65rem;
      color: var(--subtext-color);
    }

    .week-dot.day-0::after { content: '日'; }
    .week-dot.day-1::after { content: '一'; }
    .week-dot.day-2::after { content: '二'; }
    .week-dot.day-3::after { content: '三'; }
    .week-dot.day-4::after { content: '四'; }
    .week-dot.day-5::after { content: '五'; }
    .week-dot.day-6::after { content: '六'; }

    .week-number {
      font-size: 0.7rem;
      font-weight: 600;
      color: white;
    }

    .action-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .action-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-color);
      margin-bottom: 1rem;
    }

    .upload-area {
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .upload-area:hover {
      border-color: var(--theme-primary);
      background: rgba(0, 0, 0, 0.02);
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .upload-text {
      font-size: 0.9rem;
      color: var(--text-color);
    }

    #photoInput {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .group-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .group-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-color);
    }

    .group-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--theme-primary) 0%, var(--theme-secondary) 100%);
      color: white;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .group-btn:hover {
      transform: scale(1.05);
    }

    .group-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 12px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .group-item:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .group-item.active {
      border: 2px solid var(--theme-primary);
      background: rgba(var(--theme-primary), 0.05);
    }

    .group-name {
      font-weight: 500;
      color: var(--text-color);
      font-size: 0.9rem;
    }

    .group-count {
      font-size: 0.75rem;
      color: var(--subtext-color);
    }

    .gallery-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
    }

    .gallery-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 1rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .gallery-item {
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover {
      transform: scale(1.05);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-photos {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 2rem;
      width: 90%;
      max-width: 360px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .modal-subtitle {
      font-size: 0.85rem;
      color: var(--subtext-color);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .theme-select {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .theme-option {
      width: 100px;
      padding: 1rem;
      border-radius: 16px;
      border: 2px solid var(--border-color);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-option:hover {
      border-color: var(--theme-primary);
    }

    .theme-option.active {
      border-color: var(--theme-primary);
      background: rgba(var(--theme-primary), 0.1);
    }

    .theme-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .theme-name {
      font-size: 0.85rem;
      color: var(--text-color);
      font-weight: 500;
    }

    .modal-input {
      width: 100%;
      padding: 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-color);
      margin-bottom: 1.5rem;
    }

    .modal-input:focus {
      outline: none;
      border-color: var(--theme-primary);
    }

    .modal-input::placeholder {
      color: var(--subtext-color);
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .modal-btn.cancel {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-color);
    }

    .modal-btn.confirm {
      background: linear-gradient(135deg, var(--theme-primary) 0%, var(--theme-secondary) 100%);
      color: white;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 0.85rem 1.5rem;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .star {
      position: fixed;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite;
      pointer-events: none;
      z-index: 0;
    }

    .shooting-star {
      position: fixed;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
      border-radius: 1px;
      pointer-events: none;
      z-index: 0;
      transform: rotate(-45deg);
      animation: shooting 4s linear infinite;
    }

    .flower {
      position: fixed;
      font-size: 1.2rem;
      animation: float 4s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.35;
      z-index: 0;
    }

    .color-section, .stats-row, .week-trail, .action-card, .group-card, .gallery-card {
      position: relative;
      z-index: 1;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-15px) rotate(5deg); }
      50% { transform: translateY(-8px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes shooting {
      0% { opacity: 0; transform: translateX(-100px) translateY(0) rotate(-45deg); }
      10% { opacity: 1; }
      20% { opacity: 0; transform: translateX(100vw) translateY(-100vh) rotate(-45deg); }
      100% { opacity: 0; transform: translateX(100vw) translateY(-100vh) rotate(-45deg); }
    }
  </style>
</head>
<body class="garden">
  <div class="navbar">
    <h1>🎨 每日色彩</h1>
    <div class="theme-switch">
      <button class="theme-btn active" id="gardenTheme">🌸 花园</button>
      <button class="theme-btn" id="galaxyTheme">🌌 星系</button>
    </div>
  </div>

  <div class="container">
    <div class="color-section">
      <div class="today-label">
        <span class="color-dot" id="colorDot"></span>
        <span>今日色彩</span>
      </div>
      <div class="color-display" id="colorDisplay"></div>
      <div class="color-name" id="colorName">薄荷绿</div>
      <div class="color-hex" id="colorHex">Mint Green</div>
    </div>

    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-number" id="totalDays">0</div>
        <div class="stat-label">累计</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="currentStreak">0</div>
        <div class="stat-label">连续</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="groupCount">0</div>
        <div class="stat-label">小组</div>
      </div>
    </div>

    <div class="week-trail">
      <div class="week-title">七日足迹 · 第 <span id="weekNumber">1</span> 周</div>
      <div class="week-dots" id="weekDots"></div>
    </div>

    <div class="action-card">
      <div class="action-title">📸 今日打卡</div>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📷</div>
        <div class="upload-text">点击上传照片</div>
        <input type="file" id="photoInput" accept="image/*" capture="environment">
      </div>
    </div>

    <div class="group-card">
      <div class="group-header">
        <div class="group-title">我的空间</div>
        <button class="group-btn" id="createGroupBtn">+ 创建花园/星系</button>
      </div>
      <div class="group-list" id="groupList">
        <div class="group-item active">
          <div class="group-name">我的个人空间</div>
          <div class="group-count">0 张</div>
        </div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="createGroupModal">
    <div class="modal-content">
      <div class="modal-title">创建花园/星系</div>
      <div class="modal-subtitle">选择你的空间主题</div>
      <div class="theme-select">
        <div class="theme-option" id="gardenOption" onclick="selectGroupTheme('garden')">
          <div class="theme-icon">🌸</div>
          <div class="theme-name">花园</div>
        </div>
        <div class="theme-option" id="galaxyOption" onclick="selectGroupTheme('galaxy')">
          <div class="theme-icon">🌌</div>
          <div class="theme-name">星系</div>
        </div>
      </div>
      <input type="text" class="modal-input" id="groupNameInput" placeholder="输入空间名称">
      <div class="modal-actions">
        <button class="modal-btn cancel" id="cancelGroupBtn">取消</button>
        <button class="modal-btn confirm" id="confirmGroupBtn">创建</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
